[project]
name = "conget"
version = "0.1.0"
readme = "README.md"
description = "Simple CLI library for fetching web content with plugin architecture"
requires-python = ">=3.12"
dependencies = [
    "trafilatura>=2.0.0",
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "markdownify>=0.11.6",
    "tomlkit>=0.14.0",
    "yt-dlp>=2026.2.21",
    "platformdirs>=4.0.0",
    "typer>=0.24.1",
]

[project.scripts]
# Main CLI
conget = "src.cli.main:main_entry"

# Specialized fetcher CLIs (run directly from fetcher modules)
conget-default = "src.fetchers.default:cli"
conget-github-repo = "src.fetchers.github_repo:cli"
conget-hh-vacancy = "src.fetchers.hh_vacancy:cli"
conget-hh-employer = "src.fetchers.hh_employer:cli"
conget-youtube-video = "src.fetchers.youtube_video:cli"
conget-youtube-playlist = "src.fetchers.youtube_playlist:cli"
conget-myshows-show = "src.fetchers.myshows_show:cli"
conget-default-md = "src.fetchers.default_md:cli"

# Fetcher entry points (for plugins)
[project.entry-points."conget.fetchers"]
default = "src.fetchers.default:DefaultFetcher"
default-md = "src.fetchers.default_md:DefaultMdFetcher"
github-repo = "src.fetchers.github_repo:GitHubRepoFetcher"
hh-vacancy = "src.fetchers.hh_vacancy:HHVacancyFetcher"
hh-employer = "src.fetchers.hh_employer:HHEmployerFetcher"
youtube-video = "src.fetchers.youtube_video:YoutubeVideoFetcher"
youtube-playlist = "src.fetchers.youtube_playlist:YoutubePlaylistFetcher"
myshows-show = "src.fetchers.myshows_show:MyShowsShowFetcher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
